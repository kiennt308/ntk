# ==============================================================================
# ⚙️ 8. JEKYLL PLUGINS & BUILD SETTINGS
# ==============================================================================
twitter:
  username: kiennt308
  card: summary_large_image
facebook:
  app_id: null
  publisher: null

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "<!--more-->"
incremental: false

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .github/
  - README.md
  - implementation_plan.md
  - LICENSE
  - task.md
  - walkthrough.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
