# ==============================================================================
# 🏷️ 6. DANH SÁCH CHUYÊN MỤC / TOPICS (TOPIC PILLARS)
# Dùng để tự động tạo bộ lọc trên Blog, Sidebar, Topic Hubs và Trang chủ
# ==============================================================================
topics:
  - id: "aws"
    category_name: "AWS"
    title: "AWS & Cloud Architecture"
    icon: "☁️"
    badge_class: "badge--amber"
    description: "Multi-account governance with Control Tower, Landing Zones, VPC networking, security guardrails, and cost optimization."
  - id: "kubernetes"
    category_name: "Kubernetes"
    title: "Kubernetes & Containers"
    icon: "🚢"
    badge_class: "badge--cyan"
    description: "Production EKS checklists, CNI networking deep-dives, ingress controllers, pod security standards, and GitOps deployments."
  - id: "terraform"
    category_name: "Terraform"
    title: "Infrastructure as Code"
    icon: "🏗️"
    badge_class: "badge--primary"
    description: "Zero-to-hero Terraform state management, reusable modules, multi-environment pipelines, and drift detection."
  - id: "observability"
    category_name: "Observability"
    title: "Observability & SRE"
    icon: "📊"
    badge_class: "badge--emerald"
    description: "OpenTelemetry distributed tracing, metric aggregation, incident triage playbooks, and blameless postmortem templates."
  - id: "devops"
    category_name: "DevOps"
    title: "DevOps & Platform Eng"
    icon: "⚡"
    badge_class: "badge--rose"
    description: "High-velocity CI/CD workflows, developer self-service platforms, automated security scanning, and release automation."

