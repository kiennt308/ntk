# 📖 8. NỘI DUNG TRANG ABOUT (ABOUT ME & CV PROFILE)
# ==============================================================================
about_page:
  title: "About Kien Nguyen"
  hero_badge: "Senior DevOps Engineer"
  
  # Section 1: Giới thiệu & Triết lý kỹ thuật
  background:
    section_title: "1. Professional Summary & Philosophy"
    intro: "I am a **Senior DevOps / Cloud Engineer** with **10+ years of IT experience** and **5+ years specializing in AWS Cloud and DevOps**. I possess proven expertise in designing, building, and operating scalable, secure, and highly available cloud-native platforms using Infrastructure as Code (IaC), CI/CD automation, and Kubernetes. My hands-on background includes architecting multi-account AWS environments, industrial IoT real-time data pipelines, and production-grade monitoring & observability systems with a steadfast commitment to reliability engineering, automation, and security best practices."
    focus_heading: "Core Areas of Specialization"
    focus_items:
      - icon: "cloud"
        title: "AWS Cloud Architecture:"
        desc: "Designing multi-account landing zones, Control Tower, transit networking, IAM least-privilege policies, compute/storage optimization, and security compliance."
      - icon: "container"
        title: "Kubernetes & Containers:"
        desc: "Certified Kubernetes Application Developer (CKAD) & Administrator (CKA). Production Amazon EKS, Docker, Helm, GitOps workflows, cluster autoscaling, and pod security."
      - icon: "code"
        title: "Infrastructure as Code & CI/CD:"
        desc: "Modular and reusable infrastructure automation with Terraform and AWS CloudFormation. End-to-end automated testing and zero-downtime deployment pipelines."
      - icon: "zap"
        title: "IoT & Real-Time Data Pipelines:"
        desc: "Enterprise IoT solutions with AWS IoT Core & Greengrass, event-driven streaming with Kinesis, EMR, Lambda, S3, RDS, and DynamoDB for industrial manufacturing."
      - icon: "chart"
        title: "Observability & SRE:"
        desc: "Structured logging, Prometheus/Grafana monitoring dashboards, Alertmanager, AWS CloudWatch, and MTTD/MTTR incident mitigation."
    principles_heading: "Guiding Engineering Principles"
    principles:
      - title: "Automate Relentlessly:"
        desc: "Eliminate repetitive toil. If an operational task needs to be performed more than once, it must be codified into a reliable, version-controlled pipeline."
      - title: "Security as a First-Class Citizen:"
        desc: "Enforce zero-trust architecture, automated vulnerability scanning, least-privilege IAM roles, and proactive compliance guardrails across all environments."
      - title: "Resilience & High Availability:"
        desc: "Design for failure with multi-AZ redundancy, self-healing container workloads, automated failover, and validated disaster recovery strategies."
      - title: "Pragmatic & Cost-Conscious Engineering:"
        desc: "Balance cutting-edge technology with maintainability, predictable operational costs, and measurable business value."

  # Section 2: Ma trận kỹ năng chuyên môn
  competencies:
    section_title: "2. Technical Competencies Matrix"
    items:
      - icon: "cloud"
        title: "Cloud & Infrastructure"
        skills: "AWS (Control Tower, Organizations, VPC, IAM, EC2, Lambda, S3, RDS, DynamoDB, Transit Gateway, Route53, IoT Core, Greengrass, Kinesis, EMR), Microsoft Azure, Alibaba Cloud."
      - icon: "container"
        title: "Containers & Orchestration"
        skills: "Kubernetes (CKAD, CKA), Amazon EKS, Docker, Helm, Container Security, Cluster Autoscaler, Ingress Controllers, Microservices."
      - icon: "code"
        title: "Infrastructure as Code"
        skills: "Terraform (Modular blueprints & State Management), AWS CloudFormation, Ansible, Shell Scripting, Policy-as-Code."
      - icon: "zap"
        title: "CI/CD & DevSecOps"
        skills: "GitHub Actions, GitLab CI, Jenkins, Automated Build & Release, Trivy, Snyk Container Scanning, SonarQube."
      - icon: "chart"
