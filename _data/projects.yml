- title: "AWS Multi-Account Landing Zone"
  description: "Enterprise-grade AWS multi-account environment designed using a Hub-and-Spoke networking and security model. Implements automated account vending, centralized log auditing, federated access, and transit routing."
  architecture: "AWS Organizations + Control Tower + IAM Identity Center + Transit Gateway + AWS Config"
  technologies:
