- title: "Unified Observability Infrastructure"
  description: "Centralized monitoring, tracing, and logging platform built around open standards. Automatically collects distributed traces, system/app metrics, and logs from microservices and correlates them inside dashboard interfaces."
  architecture: "OpenTelemetry Collectors + Prometheus + Grafana + Loki + Tempo"
  technologies:
    - "OpenTelemetry"
    - "Prometheus"
    - "Grafana"
    - "Loki"
  github_link: "https://github.com/kiennt308/otel-observability-stack"
