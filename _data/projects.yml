- title: "Production-Ready Kubernetes Platform"
  description: "Highly-available, production-grade Amazon EKS cluster architecture bootstrapped via Terraform. Employs GitOps with ArgoCD for continuous delivery, cluster auto-scaling, ingress traffic controllers, and external DNS syncing."
  architecture: "AWS EKS + ArgoCD + Helm + VPC CNI + Karpenter + ExternalDNS + Cert-Manager"
  technologies:
    - "Kubernetes"
    - "EKS"
    - "Helm"
    - "ArgoCD"
    - "Terraform"
  github_link: "https://github.com/kiennt308/eks-platform-gitops"
