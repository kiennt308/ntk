<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#090d16">

  <!-- Immediate Theme Initializer to eliminate FOUT/flashing -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
          document.documentElement.classList.add('dark-theme');
        } else {
          document.documentElement.classList.remove('dark-theme');
        }
      } catch (e) {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>

  <!-- Icons & Web App Manifest -->
  <link rel="icon" type="image/jpeg" href="{{ site.favicon | default: '/assets/imgs/logo.jpg' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ site.favicon | default: '/assets/imgs/logo.jpg' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

  <!-- Google Fonts Preconnect & Optimized Load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  {% if site.ads.enabled or site.show_ads %}
  <!-- Preconnect to Google AdSense -->
  <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
  {% endif %}

  <!-- Jekyll SEO Plugin Tags -->
  {% seo %}

  <!-- Article Published Time Meta Tag -->
  {% if page.date %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <meta property="article:author" content="{{ site.author.name }}">
  {% endif %}

  <!-- Stylesheet with Cache Buster -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <!-- Feed Meta Plugin Tags -->
  {% feed_meta %}

  {% if site.ads.enabled and site.ads.client_id and site.ads.client_id != "" %}
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.ads.client_id }}" crossorigin="anonymous"></script>
  {% endif %}

  <!-- MathJax Configuration & Loader for LaTeX Formulas -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Mermaid.js for Technical Diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Main JavaScript File with Cache Buster -->
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
