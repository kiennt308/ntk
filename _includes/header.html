<header class="navbar">
  <div class="container navbar__container">
    <a class="logo" href="{{ '/' | relative_url }}">
      <div class="logo-badge">KN</div>
      <span class="logo-text">{{ site.title }}</span>
    </a>

    <div class="nav-actions">
      <nav class="nav-menu">
        <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        <a class="nav-link {% if page.url contains '/blog' %}active{% endif %}" href="{{ '/blog.html' | relative_url }}">Blog</a>
        <a class="nav-link {% if page.url contains '/categories' %}active{% endif %}" href="{{ '/categories.html' | relative_url }}">Topics</a>
        <a class="nav-link {% if page.url contains '/projects' %}active{% endif %}" href="{{ '/projects.html' | relative_url }}">Projects</a>
        <a class="nav-link {% if page.url contains '/about' %}active{% endif %}" href="{{ '/about.html' | relative_url }}">About</a>
        <a class="nav-link {% if page.url contains '/contact' %}active{% endif %}" href="{{ '/contact.html' | relative_url }}">Contact</a>
      </nav>

      <!-- Search icon button -->
      <a class="theme-toggle" href="{{ '/search.html' | relative_url }}" aria-label="Search articles" style="text-decoration: none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </a>

      <!-- Theme Toggle Switcher -->
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
        <!-- Sun Icon for Dark Mode -->
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
        </svg>
        <!-- Moon Icon for Light Mode -->
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>

      <!-- Mobile Hamburger Button -->
      <button class="hamburger" aria-label="Toggle Navigation Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
