<!-- Desktop Sidebar Table of Contents -->
<div class="toc" id="toc-container" style="display: none;">
  <div class="toc__header">
    <h3 class="toc__title">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
      </svg>
      <span>Mục Lục Bài Viết</span>
    </h3>
    <button type="button" class="toc__toggle-btn" id="toc-toggle-depth" title="Thu gọn / Mở rộng các mục con" aria-label="Thu gọn hoặc mở rộng mục con">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
    </button>
  </div>
  <div class="toc__progress-track">
    <div class="toc__progress-bar" id="toc-progress-bar"></div>
  </div>
  <ul id="toc-list" class="toc__list"></ul>
</div>

<!-- Mobile Floating TOC Trigger & Drawer Modal -->
<button type="button" class="mobile-toc-fab no-print" id="mobile-toc-fab" aria-label="Mở mục lục bài viết" title="Xem mục lục bài viết" style="display: none;">
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
  </svg>
  <span>Mục Lục</span>
</button>

<div class="mobile-toc-drawer no-print" id="mobile-toc-drawer" aria-hidden="true">
  <div class="mobile-toc-backdrop" id="mobile-toc-backdrop"></div>
  <div class="mobile-toc-panel">
    <div class="mobile-toc-panel__header">
      <div class="mobile-toc-panel__title">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
        </svg>
        <span>Mục Lục Bài Viết</span>
      </div>
      <button type="button" class="mobile-toc-close" id="mobile-toc-close" aria-label="Đóng mục lục">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="mobile-toc-panel__body">
      <ul id="mobile-toc-list" class="toc__list"></ul>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const tocContainer = document.getElementById('toc-container');
    const tocList = document.getElementById('toc-list');
    const mobileTocFab = document.getElementById('mobile-toc-fab');
    const mobileTocDrawer = document.getElementById('mobile-toc-drawer');
    const mobileTocList = document.getElementById('mobile-toc-list');
    const mobileTocClose = document.getElementById('mobile-toc-close');
    const mobileTocBackdrop = document.getElementById('mobile-toc-backdrop');
    const tocToggleDepth = document.getElementById('toc-toggle-depth');
    const articleBody = document.querySelector('.article-body');
    
    if (!articleBody || !tocContainer || !tocList) return;

    const headers = articleBody.querySelectorAll('h2, h3');
    
    if (headers.length > 0) {
      tocContainer.style.display = 'block';
      if (mobileTocFab) mobileTocFab.style.display = 'inline-flex';
      const tocLinks = [];

      headers.forEach((header, index) => {
        if (!header.id) {
          header.id = 'section-' + index;
        }
        
        const isH3 = header.tagName.toLowerCase() === 'h3';
        const cleanText = header.textContent.replace(/[¶#]/g, '').trim();

        // 1. Desktop TOC item
        const li = document.createElement('li');
        li.className = isH3 ? 'toc-item toc-h3' : 'toc-item toc-h2';
        
        const a = document.createElement('a');
        a.href = '#' + header.id;
        a.className = 'toc-link';
        a.textContent = cleanText;
        
        li.appendChild(a);
        tocList.appendChild(li);

        // 2. Mobile TOC item
        if (mobileTocList) {
          const mLi = document.createElement('li');
          mLi.className = isH3 ? 'toc-item toc-h3' : 'toc-item toc-h2';
          const mA = document.createElement('a');
          mA.href = '#' + header.id;
          mA.className = 'toc-link';
          mA.textContent = cleanText;
          mLi.appendChild(mA);
          mobileTocList.appendChild(mLi);

          mA.addEventListener('click', () => {
            closeMobileToc();
          });
        }

        tocLinks.push({ header, link: a });
      });

      // Mobile Drawer Toggle Handlers
      function openMobileToc() {
        if (!mobileTocDrawer) return;
        mobileTocDrawer.classList.add('active');
        mobileTocDrawer.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeMobileToc() {
        if (!mobileTocDrawer) return;
        mobileTocDrawer.classList.remove('active');
        mobileTocDrawer.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      if (mobileTocFab) mobileTocFab.addEventListener('click', openMobileToc);
      if (mobileTocClose) mobileTocClose.addEventListener('click', closeMobileToc);
      if (mobileTocBackdrop) mobileTocBackdrop.addEventListener('click', closeMobileToc);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && mobileTocDrawer && mobileTocDrawer.classList.contains('active')) {
          closeMobileToc();
        }
      });

      // Toggle H3 Subheadings Collapse
      let isH3Collapsed = false;
      if (tocToggleDepth) {
        tocToggleDepth.addEventListener('click', () => {
          isH3Collapsed = !isH3Collapsed;
          tocContainer.classList.toggle('toc--h3-collapsed', isH3Collapsed);
          tocToggleDepth.classList.toggle('collapsed', isH3Collapsed);
          tocToggleDepth.setAttribute('title', isH3Collapsed ? 'Mở rộng các mục con H3' : 'Thu gọn các mục con H3');
        });
      }

      // High-precision Scrollspy using IntersectionObserver
      const observerOptions = {
        root: null,
        rootMargin: '-90px 0px -65% 0px',
        threshold: 0
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.getAttribute('id');
            tocLinks.forEach(item => {
              if (item.header.id === id) {
                item.link.classList.add('active');
                // Scroll TOC item into view inside sticky sidebar if needed
                const liContainer = item.link.closest('.toc-item');
                if (liContainer && tocContainer) {
                  const tocRect = tocContainer.getBoundingClientRect();
                  const itemRect = liContainer.getBoundingClientRect();
                  if (itemRect.bottom > tocRect.bottom || itemRect.top < tocRect.top) {
                    liContainer.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                  }
                }
              } else {
                item.link.classList.remove('active');
              }
            });
          }
        });
      }, observerOptions);

      headers.forEach(header => observer.observe(header));
    }
  });
</script>
