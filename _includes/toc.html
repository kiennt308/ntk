<div class="toc" id="toc-container" style="display: none;">
  <h3 class="toc__title">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
    </svg>
    On This Page
  </h3>
  <ul id="toc-list"></ul>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const tocContainer = document.getElementById('toc-container');
    const tocList = document.getElementById('toc-list');
    const articleBody = document.querySelector('.article-body');
    
    if (!articleBody || !tocContainer || !tocList) return;

    const headers = articleBody.querySelectorAll('h2, h3');
    
    if (headers.length > 0) {
      tocContainer.style.display = 'block';
      const tocLinks = [];

      headers.forEach((header, index) => {
        if (!header.id) {
          header.id = 'section-' + index;
        }
        
        const li = document.createElement('li');
        if (header.tagName.toLowerCase() === 'h3') {
          li.className = 'toc-h3';
        }
        
        const a = document.createElement('a');
        a.href = '#' + header.id;
        a.textContent = header.textContent.replace('¶', '').trim();
        
        li.appendChild(a);
        tocList.appendChild(li);
        tocLinks.push({ header, link: a });
      });

      // Scrollspy using IntersectionObserver
      const observerOptions = {
        root: null,
        rootMargin: '-80px 0px -70% 0px',
        threshold: 0
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.getAttribute('id');
            tocLinks.forEach(item => {
              if (item.header.id === id) {
                item.link.classList.add('active');
              } else {
                item.link.classList.remove('active');
              }
            });
          }
        });
      }, observerOptions);

      headers.forEach(header => observer.observe(header));
    }
  });
</script>
