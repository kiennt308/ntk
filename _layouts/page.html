---
layout: default
---
<div class="container container--narrow" style="margin-top: 1rem;">
  <header style="margin-bottom: 2.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border-color);">
    <h1 class="page-title" style="font-size: 2.75rem; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 0.5rem 0;">
      {{ page.title }}
    </h1>
    {% if page.description %}
      <p style="font-size: 1.15rem; color: var(--text-secondary); margin: 0;">{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="page-content article-body">
    {{ content }}
  </div>
</div>
