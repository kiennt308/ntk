<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 90" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-bn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="btn-grad-bn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow-bn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect width="728" height="90" rx="10" fill="url(#bg-grad-bn)" stroke="#334155" stroke-width="1.2" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="45" r="40" fill="#8b5cf6" opacity="0.2" filter="url(#glow-bn)" />

  <!-- Content Left -->
  <rect x="24" y="16" width="120" height="18" rx="9" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="0.8" />
  <text x="84" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">TERRAFORM &amp; IAC</text>

  <text x="24" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="-0.2">
    Zero-to-Hero Terraform &amp; GitOps Playbooks
  </text>
  <text x="24" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">
    Enterprise infrastructure automation patterns from real-world systems.
  </text>

  <!-- CTA Button Right -->
  <rect x="560" y="24" width="144" height="42" rx="8" fill="url(#btn-grad-bn)" />
  <text x="632" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    Get Free Guide →
  </text>
</svg>
