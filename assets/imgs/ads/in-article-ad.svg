<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 140" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-in" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="btn-grad-in" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow-in" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect width="728" height="140" rx="12" fill="url(#bg-grad-in)" stroke="#334155" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="60" cy="70" r="60" fill="#10b981" opacity="0.15" filter="url(#glow-in)" />
  <circle cx="580" cy="70" r="70" fill="#06b6d4" opacity="0.15" filter="url(#glow-in)" />

  <!-- Decorative Icon Box Left -->
  <rect x="30" y="32" width="76" height="76" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <!-- Blueprint Icon -->
  <path d="M52 54h32v32H52z" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M52 65h32M68 54v32M60 76h16" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Content Center -->
  <rect x="125" y="28" width="130" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
  <text x="190" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">DEV TOOLS &amp; BLUEPRINTS</text>

  <text x="125" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-0.3">
    Production AWS &amp; Kubernetes Blueprint Kit
  </text>
  <text x="125" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8">
    Reusable Terraform modules, GitOps deployment templates &amp; security guardrails.
  </text>

  <!-- CTA Button Right -->
  <rect x="540" y="48" width="158" height="44" rx="8" fill="url(#btn-grad-in)" />
  <text x="619" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    Explore Blueprints →
  </text>
</svg>
