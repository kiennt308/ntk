<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="btn-grad-sq" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow-sq" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect width="300" height="250" rx="12" fill="url(#bg-grad-sq)" stroke="#334155" stroke-width="1.5" />

  <!-- Ambient Glow Shapes -->
  <circle cx="260" cy="40" r="50" fill="#06b6d4" opacity="0.15" filter="url(#glow-sq)" />
  <circle cx="40" cy="210" r="60" fill="#6366f1" opacity="0.15" filter="url(#glow-sq)" />

  <!-- Decorative Grid Pattern -->
  <path d="M0 50h300M0 100h300M0 150h300M0 200h300M50 0v250M100 0v250M150 0v250M200 0v250M250 0v250" stroke="#334155" stroke-width="0.5" opacity="0.25" />

  <!-- Badge -->
  <rect x="20" y="22" width="145" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="32" cy="34" r="4" fill="#06b6d4" />
  <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">CLOUD ADVISORY</text>

  <!-- Headline -->
  <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="-0.2">
    Architecture &amp; SRE
  </text>
  <text x="20" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#38bdf8" letter-spacing="-0.2">
    Consulting Services
  </text>

  <!-- Subtitle -->
  <text x="20" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">
    Production AWS, Kubernetes EKS,
  </text>
  <text x="20" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">
    Terraform IaC &amp; Cost Optimization.
  </text>

  <!-- CTA Button -->
  <rect x="20" y="180" width="260" height="42" rx="8" fill="url(#btn-grad-sq)" />
  <text x="150" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.2">
    Book Consultation →
  </text>
</svg>
