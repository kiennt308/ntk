<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="azureGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008AD7"/>
      <stop offset="100%" stop-color="#003A70"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E8F0"/>
      <stop offset="100%" stop-color="#9BB0C1"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Hexagon Outer -->
  <polygon points="150,15 265,80 265,220 150,285 35,220 35,80" fill="url(#azureGrad2)" stroke="#50E6FF" stroke-width="4" filter="url(#shadow2)"/>
  <polygon points="150,28 252,87 252,213 150,272 48,213 48,87" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  
  <!-- Microsoft Logo -->
  <g transform="translate(136, 52)">
    <rect x="0" y="0" width="12" height="12" fill="#F25022"/>
    <rect x="15" y="0" width="12" height="12" fill="#7FBA00"/>
    <rect x="0" y="15" width="12" height="12" fill="#00A4EF"/>
    <rect x="15" y="15" width="12" height="12" fill="#FFB900"/>
  </g>

  <text x="150" y="105" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1">MICROSOFT CERTIFIED</text>
  <text x="150" y="132" text-anchor="middle" fill="#50E6FF" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="16">Azure Administrator</text>
  
  <!-- Ribbon Badge -->
  <rect x="65" y="165" width="170" height="30" rx="6" fill="url(#silverGrad)" filter="url(#shadow2)"/>
  <text x="150" y="186" text-anchor="middle" fill="#002040" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="1.5">ASSOCIATE</text>
  
  <!-- 2 Stars -->
  <g fill="#50E6FF" transform="translate(132, 218)">
    <path d="M0,8 L3,0 L6,8 L0,3 L7,3 Z" transform="scale(1.2)"/>
    <path d="M18,8 L21,0 L24,8 L18,3 L25,3 Z" transform="translate(10, 0) scale(1.2)"/>
  </g>
</svg>