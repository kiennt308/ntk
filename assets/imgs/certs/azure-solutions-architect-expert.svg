<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#002050"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Hexagon Outer -->
  <polygon points="150,15 265,80 265,220 150,285 35,220 35,80" fill="url(#azureGrad)" stroke="#50E6FF" stroke-width="4" filter="url(#shadow)"/>
  <!-- Inner Ring -->
  <polygon points="150,28 252,87 252,213 150,272 48,213 48,87" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  
  <!-- Microsoft 4-square Logo -->
  <g transform="translate(136, 52)">
    <rect x="0" y="0" width="12" height="12" fill="#F25022"/>
    <rect x="15" y="0" width="12" height="12" fill="#7FBA00"/>
    <rect x="0" y="15" width="12" height="12" fill="#00A4EF"/>
    <rect x="15" y="15" width="12" height="12" fill="#FFB900"/>
  </g>

  <!-- Title Text -->
  <text x="150" y="105" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1">MICROSOFT CERTIFIED</text>
  <text x="150" y="132" text-anchor="middle" fill="#50E6FF" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="16">Azure Solutions</text>
  <text x="150" y="154" text-anchor="middle" fill="#50E6FF" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="16">Architect</text>
  
  <!-- Ribbon Badge -->
  <rect x="75" y="175" width="150" height="30" rx="6" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="150" y="196" text-anchor="middle" fill="#001830" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="1.5">EXPERT</text>
  
  <!-- 3 Stars -->
  <g fill="#FFD700" transform="translate(122, 222)">
    <path d="M0,8 L3,0 L6,8 L0,3 L7,3 Z"/>
    <path d="M14,8 L17,0 L20,8 L14,3 L21,3 Z" transform="translate(11, -2) scale(1.1)"/>
    <path d="M28,8 L31,0 L34,8 L28,3 L35,3 Z" transform="translate(24, 0)"/>
  </g>
</svg>